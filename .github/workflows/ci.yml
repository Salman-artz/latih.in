name: CI/CD & Docker Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: latih_in_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/latih_in_test?schema=public"
      JWT_SECRET: "ci-test-jwt-secret-key-production-ready-min-48-chars-long-2026"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Setup Database Schema
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: Run Vitest Suite (Unit, Scoring & Concurrency)
        run: npm test

  docker-build:
    name: Build & Verify Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and smoke test Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: latih-in:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
