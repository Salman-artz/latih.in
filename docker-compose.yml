services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latihin-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/latih_in?schema=public
      - JWT_SECRET=latih-in-super-secure-jwt-secret-key-production-ready-min-48-chars-long-2026
      - APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: latihin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: latih_in
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d latih_in"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
